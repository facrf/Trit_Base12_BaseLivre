# ==============================================================================
# Pipeline GitLab CI/CD - CPU Ternária 6502-T
# Testes Automatizados e Publicação Multi-Arch no GitLab Container Registry
# ==============================================================================

stages:
  - test
  - publish

variables:
  DOCKER_TLS_CERTDIR: "/certs"
  DOCKER_DRIVER: overlay2

# ------------------------------------------------------------------------------
# Etapa 1: Suite de Regressão e Verificação Lógica (31/31 testes)
# ------------------------------------------------------------------------------
test-suite:
  stage: test
  image: python:3.12-alpine
  before_script:
    - apk add --no-cache make bash
  script:
    - make test-all
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH || $CI_COMMIT_TAG

# ------------------------------------------------------------------------------
# Etapa 2: Compilação e Publicação Multi-Arch (AMD64, ARM64, RISC-V)
# ------------------------------------------------------------------------------
publish-multiarch:
  stage: publish
  image: docker:27
  services:
    - docker:27-dind
  before_script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
    - docker run --privileged --rm tonistiigi/binfmt --install all
    - docker buildx create --use --name gitlab-builder
    - docker buildx inspect --bootstrap
  script:
    - |
      if [ -n "$CI_COMMIT_TAG" ]; then
        TAG_ARGS="-t $CI_REGISTRY_IMAGE:$CI_COMMIT_TAG -t $CI_REGISTRY_IMAGE:latest"
      else
        TAG_ARGS="-t $CI_REGISTRY_IMAGE:latest -t $CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA"
      fi
    - docker buildx build --platform linux/amd64,linux/arm64,linux/riscv64 -f Dockerfile.web $TAG_ARGS --push .
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH || $CI_COMMIT_TAG
